{{- if eq (include "pod-reloader.rbacv2_new_scheme" .) "true" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  creationTimestamp: null
  labels:
    heritage: deckhouse
    module: pod-reloader
    rbac.deckhouse.io/aggregate-to-infrastructure-as: viewer
    rbac.deckhouse.io/kind: capability
    rbac.deckhouse.io/capability: "system-capability.pod-reloader.view"
    rbac.deckhouse.io/scope: system
    rbac.deckhouse.io/namespace: d8-pod-reloader
  name: d8:system-capability:pod-reloader:view
  annotations:
    en.meta.deckhouse.io/title: "Module pod-reloader: view configuration"
    ru.meta.deckhouse.io/title: "Модуль pod-reloader: просмотр конфигурации"
    en.meta.deckhouse.io/description: "Read-only access to the pod-reloader module configuration."
    ru.meta.deckhouse.io/description: "Доступ только на чтение к конфигурации модуля pod-reloader."
rules:
- apiGroups:
  - deckhouse.io
  resourceNames:
  - pod-reloader
  resources:
  - moduleconfigs
  verbs:
  - get
  - list
  - watch
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  creationTimestamp: null
  labels:
    heritage: deckhouse
    module: pod-reloader
    rbac.deckhouse.io/aggregate-to-infrastructure-as: viewer
    rbac.deckhouse.io/kind: manage
    rbac.deckhouse.io/level: module
    rbac.deckhouse.io/namespace: d8-pod-reloader
  name: d8:manage:permission:module:pod-reloader:view
rules:
- apiGroups:
  - deckhouse.io
  resourceNames:
  - pod-reloader
  resources:
  - moduleconfigs
  verbs:
  - get
  - list
  - watch
{{- end }}
