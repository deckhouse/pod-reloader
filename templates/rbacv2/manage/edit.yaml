{{- if eq (include "pod-reloader.rbacv2_new_scheme" .) "true" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  creationTimestamp: null
  labels:
    heritage: deckhouse
    module: pod-reloader
    rbac.deckhouse.io/aggregate-to-infrastructure-as: manager
    rbac.deckhouse.io/kind: capability
    rbac.deckhouse.io/capability: "system-capability.pod-reloader.edit"
    rbac.deckhouse.io/scope: system
    rbac.deckhouse.io/namespace: d8-pod-reloader
  name: d8:system-capability:pod-reloader:edit
  annotations:
    en.meta.deckhouse.io/title: "Module pod-reloader: edit configuration"
    ru.meta.deckhouse.io/title: "Модуль pod-reloader: управление конфигурацией"
    en.meta.deckhouse.io/description: "Manage the pod-reloader module configuration."
    ru.meta.deckhouse.io/description: "Управление конфигурацией модуля pod-reloader."
rules:
- apiGroups:
  - deckhouse.io
  resourceNames:
  - pod-reloader
  resources:
  - moduleconfigs
  verbs:
  - create
  - update
  - patch
  - delete
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  creationTimestamp: null
  labels:
    heritage: deckhouse
    module: pod-reloader
    rbac.deckhouse.io/aggregate-to-infrastructure-as: manager
    rbac.deckhouse.io/kind: manage
    rbac.deckhouse.io/level: module
    rbac.deckhouse.io/namespace: d8-pod-reloader
  name: d8:manage:permission:module:pod-reloader:edit
rules:
- apiGroups:
  - deckhouse.io
  resourceNames:
  - pod-reloader
  resources:
  - moduleconfigs
  verbs:
  - create
  - update
  - patch
  - delete
{{- end }}
