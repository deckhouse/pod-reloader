---
image: release-channel-version
from: {{ index $.Images "base/scratch" }}
import:
  - image: images-digests-and-version
    add: /
    to: /
    after: install
    includePaths:
      - version.json
      - changelog.yaml
      - module.yaml
  - image: choose-edition
    add: /openapi
    to: /openapi
    after: install
git:
  - add: /
    to: /
    includePaths:
      - docs
    excludePaths:
      - docs/internal
