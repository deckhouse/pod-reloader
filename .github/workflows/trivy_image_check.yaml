name: Build and checks

on:
  schedule:
    - cron: "0 01 * * 0,3" # Regular CVE scan
  pull_request:
    types: [opened, reopened, labeled, synchronize]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_branch:
        description: "Optional. Set minor version of release you want to scan. e.g.: 1.23"
        required: false
      scan_several_latest_releases:
        description: "Optional. Whether to scan last several releases or not. true/false. For scheduled pipelines it is always true. Default is: false."
        required: false
      latest_releases_amount:
        description: "Optional. Number of latest release lines (major.minor) to scan. Default is: 1"
        required: false
      release_in_dev:
        description: "Optional. If true, the release tag is taken from the dev registry. Default is: false"
        required: false
      trivy_reports_log_output:
        description: "Optional. Trivy report verbosity in logs: 0 = off, 1 = CVE report, 2 = license report. Default is: 1"
        required: false

jobs:
  build_dev:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/build_dev.yml
    secrets: inherit
  cve_scan_on_pr:
    if: github.event_name == 'pull_request'
    name: CVE scan for PR
    runs-on: [self-hosted, regular]
    needs: [build_dev]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Split repository name
        id: split
        env:
          REPO: ${{ github.event.repository.name }}
        run: echo "role_name=${REPO##*/}" >> $GITHUB_OUTPUT
      - uses: deckhouse/modules-actions/cve_scan@v17
        with:
          source_tag: pr${{ github.event.number }}
          case: "External Modules"
          external_module_name: ${{ vars.MODULE_NAME }}
          prod_registry: "registry.deckhouse.io"
          prod_registry_user: "license-token"
          prod_registry_password: ${{ secrets.PROD_MODULES_READ_REGISTRY_PASSWORD }}
          dev_registry: ${{ vars.DEV_REGISTRY }}
          dev_registry_user: ${{ vars.DEV_MODULES_REGISTRY_LOGIN }}
          dev_registry_password: ${{ secrets.DEV_MODULES_REGISTRY_PASSWORD }}
          trivy_reports_log_output: ${{ github.event.inputs.trivy_reports_log_output || '1' }}
          role_name: ${{ steps.split.outputs.role_name }}
  cve_scan:
    if: github.event_name != 'pull_request'
    name: Regular CVE scan
    runs-on: [self-hosted, regular]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Split repository name
        id: split
        env:
          REPO: ${{ github.event.repository.name }}
        run: echo "role_name=${REPO##*/}" >> $GITHUB_OUTPUT
      - uses: deckhouse/modules-actions/cve_scan@v17
        with:
          source_tag: ${{ github.event.inputs.release_branch || github.event.repository.default_branch }}
          case: "External Modules"
          external_module_name: ${{ vars.MODULE_NAME }}
          prod_registry: "registry.deckhouse.io"
          prod_registry_user: "license-token"
          prod_registry_password: ${{ secrets.PROD_MODULES_READ_REGISTRY_PASSWORD }}
          dev_registry: ${{ vars.DEV_REGISTRY }}
          dev_registry_user: ${{ vars.DEV_MODULES_REGISTRY_LOGIN }}
          dev_registry_password: ${{ secrets.DEV_MODULES_REGISTRY_PASSWORD }}
          scan_several_latest_releases: ${{ github.event.inputs.scan_several_latest_releases || 'True' }}
          # Release lines (major.minor) to scan besides main. pod-reloader has a
          # single line, 1.0, on every release channel. Raise the number when a
          # new minor is published while the previous one is still on a channel.
          # The prod registry also holds v0.1.0 and v0.2.0, which are not
          # releases: any value above the number of real lines pulls them in.
          latest_releases_amount: ${{ github.event.inputs.latest_releases_amount || '1' }}
          release_in_dev: ${{ github.event.inputs.release_in_dev || 'False' }}
          trivy_reports_log_output: ${{ github.event.inputs.trivy_reports_log_output || '1' }}
          role_name: ${{ steps.split.outputs.role_name }}
